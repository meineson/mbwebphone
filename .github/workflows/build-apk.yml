# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: MeConf Build APK

on:
  push:
    branches: 
      - "TauriUI"
    # paths:
    #   - 'changelog_apk.md'
    tags:
      - "v*.*.*"

jobs:
  build:

    runs-on:  macos-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}  # 匹配自定义名称

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'


    - name: Get version from package.json
      id: get_version
      run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

    - name: Use version
      run: echo "Package version is $VERSION"
      
    - name: Check Rust
      run: rustup --version && rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 17    
        distribution: "oracle"

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d  # 选择合适的NDK版本，例如 r21d, r22b 等
        add-to-path: true  # 将NDK路径添加到PATH环境变量中

    - name: build apk
      env:
        NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: yarn && yarn tauri android build 

    - name: Create Release snapshot
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: '1.3.2'
        token: ${{ secrets.REL_TOKEN }}
        name: "MeConf Nightly build ALL"
        draft: false
        prerelease: false
        generate_release_notes: false
        files: |
          ./changelog_apk.md
          ./**/*release.apk
