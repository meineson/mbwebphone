# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: meconf build snapshot

on:
  push:
    branches: 
      - "newui"
    paths:
      - 'changelog.md'
    tags:
      - "v*.*.*"

jobs:
  build:

    runs-on:  macos-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}  # 匹配自定义名称

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm i
    - run: npm run web   
    - run: npx electron-builder -m dmg --x64 --arm64 
    - run: npx electron-builder -l deb --x64 --arm64 
    - run: npx electron-builder -w nsis --x64
    - run: npx electron-builder -w nsis --arm64 
    - name: Create Release snapshot
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: '1.3.2'
        token: ${{ secrets.REL_TOKEN }}
        name: "MeConf Nightly build ALL"
        draft: false
        prerelease: false
        generate_release_notes: true
        body_path: ./changelog.md
        files: |
          ./changelog.md
          ./dist/MeConf_web.tgz         
          ./dist/*.dmg                   
          ./dist/*.exe                   
          ./dist/*.deb                                       